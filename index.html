<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. B. S. Saini</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#e9f7ff,#ffffff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:#ffffff;
  border-radius:28px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,83,135,0.15);
  border:1px solid #dff3ff;
}

.logo{
  width:105px;
  height:105px;
  border-radius:50%;
  background:linear-gradient(135deg,#0077b6,#00b4d8);
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:38px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,119,182,0.3);
}

h1{
  color:#023e8a;
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#0077b6;
  font-weight:bold;
  font-size:15px;
  margin-bottom:14px;
}

.bio{
  color:#555;
  font-size:15px;
  line-height:1.6;
  margin-bottom:24px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
  color:white;
  text-decoration:none;
  font-size:17px;
  font-weight:bold;
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-2px);
  opacity:0.92;
}

.instagram{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);}
.facebook{background:#1877F2;}
.youtube{background:#FF0000;}
.review{background:#34A853;}
.whatsapp{background:#25D366;}

.footer{
  margin-top:22px;
  color:#777;
  font-size:13px;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">BS</div>

  <h1>Dr. B. S. Saini</h1>

  <div class="subtitle">Care • Trust • Healing</div>

  <p class="bio">
    Welcome to Dr. B. S. Saini’s Digital Connect.<br>
    Book appointments, follow health updates, share your feedback,
    and connect with us easily — all in one place.
  </p>

  <a class="btn instagram" href="YOUR_INSTAGRAM_LINK">Instagram</a>

  <a class="btn facebook" href="YOUR_FACEBOOK_LINK">Facebook</a>

  <a class="btn youtube" href="YOUR_YOUTUBE_LINK">YouTube</a>

  <a class="btn review" href="YOUR_GOOGLE_REVIEW_LINK">Leave a Google Review</a>

  <a class="btn whatsapp" href="https://wa.me/91XXXXXXXXXX?text=Hello%20Doctor,%20I%20want%20to%20book%20an%20appointment">
    WhatsApp Appointment
  </a>

  <div class="footer">
    Scan • Connect • Care
  </div>

</div>

</body>
</html>
